architectury {
    common enabled_platforms.split(',')
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${fabric_loader}"

    compileOnly("dev.ftb.mods:ftb-library-fabric:${ftb_library}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-teams-fabric:${ftb_teams}") { transitive = false }
    compileOnly("dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks}") { transitive = false }
    compileOnly("xaero.lib:xaerolib-fabric-${minecraft_version}:${xaero_lib}") { transitive = false }
    compileOnly("xaero.map:xaeroworldmap-fabric-${minecraft_version}:${xaero_worldmap}") { transitive = false }
    compileOnly("xaero.minimap:xaerominimap-fabric-${minecraft_version}:${xaero_minimap}") { transitive = false }
}
