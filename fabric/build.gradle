plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${fabric_loader}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api}"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')

    implementation("dev.ftb.mods:ftb-library-fabric:${ftb_library}") { transitive = false }
    implementation("dev.ftb.mods:ftb-teams-fabric:${ftb_teams}") { transitive = false }
    implementation("dev.ftb.mods:ftb-chunks-fabric:${ftb_chunks}") { transitive = false }
    implementation("xaero.lib:xaerolib-fabric-${minecraft_version}:${xaero_lib}") { transitive = false }
    implementation("xaero.map:xaeroworldmap-fabric-${minecraft_version}:${xaero_worldmap}") { transitive = false }
    localRuntime("xaero.minimap:xaerominimap-fabric-${minecraft_version}:${xaero_minimap}") { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', minecraft_version
    inputs.property 'java_version', java_version
    inputs.property 'fabric_loader', fabric_loader

    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: minecraft_version, java_version: java_version, fabric_loader: fabric_loader
    }
}

jar {
    archiveClassifier = 'raw'
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = ''
}

shadow.addShadowVariantIntoJavaComponent = false

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact shadowJar
        }
    }
}
